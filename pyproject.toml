[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalstat"
version = "0.1.0"
description = "Tells you whether an LLM eval change is real or noise, using the pairing your eval run already has."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "DIYAS" }]
keywords = ["llm", "eval", "evals", "promptfoo", "statistics", "mcnemar", "ci"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
evalstat = "evalstat.cli:main"

[project.urls]
Homepage = "https://github.com/diskaver-it/evalstat"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
